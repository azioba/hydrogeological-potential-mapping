[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hydromap"
version = "2.1.0"
description = "Open-source toolkit for groundwater potential zone mapping at national scale"
readme = "README.md"
authors = [
    { name = "HAMIDOU BÂ Abdoul Aziz", email = "azmaba@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "geopandas>=0.13.0",
    "rasterio>=1.3.0",
    "rioxarray>=0.14.0",
    "folium>=0.14.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.2.0",
    "jenkspy>=0.3.2",
    "requests>=2.28.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
